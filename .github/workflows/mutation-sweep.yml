name: weekly

# WEEKLY, plus a button. reshape-plan step 0.6.
#
# WHY IT IS NOT ON EVERY PR. The merge gate already proves the browser-free registries red on every
# pull request (`red-proof` in ci.yml, the same driver with `--tier fast`). What this job adds is the
# half a merge gate cannot afford: the nine known mutants, whose killers are page-side properties and
# therefore need Chromium. `red-proof` installs none, deliberately — a killer-suite leg with a
# browser cell fails EVERY mutant's baseline, measured on CI at 8 failed / 135 passed on both arms
# while green locally, which reads as a hole in the matrix rather than as a missing browser.
#
# WHY WEEKLY AND NOT NIGHTLY. Nothing here changes without a commit, so a nightly cadence buys six
# extra runs of an unchanged tree per week. Weekly is the plan's own wording ("weekly; a survivor not
# in `known_survivors` fails") and it is what the repo owner chose on 2026-08-26 for the scheduled
# channels generally. `workflow_dispatch` is the ad-hoc lever for when that is not soon enough.
#
# HOW ANYONE HEARS ABOUT A RED RUN, stated because it is not obvious and a channel nobody watches is
# not a channel. There is no PR to go red: GitHub notifies the account whose credentials the schedule
# runs under, which is the last person to have edited this cron. If that stops being the right person,
# the fix is a notification rule, not a quieter job.
#
# WHAT AN OPERATOR DOES WHEN IT GOES RED AND THEY CANNOT FIX IT TODAY. This matters more than the
# schedule: a loud channel with no way to acknowledge gets `|| true`d, and takes everything else dark
# with it (R3.9/CLI-1). The acknowledgement here ALREADY EXISTS and is not a new flag — a survivor is
# registered in that registry's `KNOWN_SURVIVORS` with a reason and a finding id, which is a reviewed
# diff rather than a silenced alarm. `prove_red` then fails in the OTHER direction the day it starts
# being killed again, so the list can only shrink.
#
# THE SECOND TENANT ARRIVED AT 0.137.0 (reshape-plan 2.4). Three jobs now, and they cost very
# different things, which is why they are separated rather than folded into one:
#
#   sweep            free, ~9 min, schedule + dispatch. Unchanged.
#   substrates       free, EVERY trigger including pull_request. TWO matrix legs since 0.172.0
#                    (gitea, odoo); Gitea's is ~2 min, Odoo's has never run here at all. Brings a
#                    benchmark substrate up and proves it serves and can be written to.
#   customer-bench   SPENDS MONEY. TWO matrix legs since 0.172.0, each gated against its own
#                    baseline. Observed per-pass spend is ~$0.60 a substrate (Gitea's three passes
#                    averaged $0.603, Odoo's $0.602), so ~$1.20 a week for both. Do NOT read the
#                    baselines' `cost_usd` as the spend: those are 0.842 and 0.664 because a
#                    baseline records the MAXIMUM observed as its alarm threshold (R4.106).
#                    **OFF THE SCHEDULE SINCE 0.181.0** -- dispatch only. See the job's own header.
#
# WHY `substrates` RUNS ON PULL REQUESTS AND THE OTHER TWO DO NOT. It is the only free one, and it
# guards the premise the paid one rests on: the benchmark's dollars are wasted if the substrate was
# never serving properly, and that failure mode is quiet by nature (R4.89 is a database manager
# served with HTTP 200 at every URL readiness looked at). Running it per-PR also stops it rotting —
# a container layer nothing exercises between weekly runs is one that breaks silently.
#
# MONEY IS NEVER SPENT BY ACCIDENT, AND SINCE 0.181.0 IT IS NOT SPENT ON A TIMER EITHER.
# `run_bench` defaults to FALSE, so dispatching this workflow to re-run the mutation sweep does not
# also buy a benchmark pass -- and `customer-bench` no longer accepts the `schedule` trigger at all,
# because active development stopped on 2026-09-09 and a weekly paid measurement of a tree that does
# not move buys nothing. Everything free here is unchanged and still runs.

on:
  schedule:
    # Mondays 04:17 UTC. Off the hour deliberately: GitHub queues scheduled runs and the top of the
    # hour is the most contended minute there is.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      run_bench:
        description: "also run the customer benchmark, BOTH substrates (SPENDS ~$1.20, needs ANTHROPIC_API_KEY) -- the ONLY way to run it since 0.181.0"
        type: boolean
        default: false
  # PULL REQUESTS reach the `substrates` job only — see the header. Path-filtered, because the
  # container layer cannot be affected by a change that touches neither the bench nor this file.
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'baselines/**'
      - '.github/workflows/mutation-sweep.yml'

# NOT `cancel-in-progress`. A manual dispatch while the weekly run is in flight would otherwise kill
# it, and the two are asking the same question — there is nothing to supersede.
concurrency:
  group: mutation-sweep
  cancel-in-progress: false

# READ ONLY. This job checks out, installs and runs tests; it writes nothing back. Least privilege is
# worth stating explicitly on a SCHEDULED workflow in particular, because a scheduled run carries the
# repository's own token with no PR review standing behind the commit that changed it.
permissions:
  contents: read

jobs:
  sweep:
    name: every mutation registry, one at a time
    # NOT ON PULL REQUESTS: `red-proof` in ci.yml already runs the browser-free half on every PR, and
    # the browser half costs ~9 minutes to tell a merge gate something a weekly cadence is enough for.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          # FULL history, for the same reason every other job here takes it: `tests/` derives the
          # tier manifest's re-derivation deltas from `git log --follow`, and this job imports the
          # manifest to decide which registries are browser-side.
          fetch-depth: 0

      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      # BYTE-IDENTICAL to ci.yml's install, and `tests/test_ci_provisioning.py` asserts that across
      # every workflow file rather than within one. That cell was written when a single job's two
      # OS-conditional installs had DRIFTED so the linux arm carried `--with-deps`; a second workflow
      # file is the same door one building over.
      - name: Install Chromium
        timeout-minutes: 8
        run: uv run --group bench playwright install chromium

      # THE WHOLE SWEEP, one step. The registry SET is derived from `tests/mutations/`, each
      # registry's killer suite is declared in the registry, and the tier split is read out of the
      # tier manifest — so this command does not name a single registry and cannot go stale when a
      # seventh is added. That was the point: the six `--tests` invocations this replaces were a
      # hand-typed list that nothing could fail for.
      - name: Sweep every registry
        timeout-minutes: 45
        run: uv run --group bench --group providers --group mcp python scripts/mutation_sweep.py

  # ------------------------------------------------------------------------------------------------
  # THE SUBSTRATE PREFLIGHT (reshape-plan 2.4). Free, browser-free, and it runs on every trigger.
  #
  # IT IS ALSO A MEASUREMENT, and that is why it landed before the paid job rather than beside it.
  # Two modules in this repository assert that "Docker is present on a developer host and absent on
  # CI" — `benchmarks/oracle_liveness.py` in its docstring, and CLAUDE.md as the third axis of
  # local-vs-CI divergence. Traced to its evidence, that claim rests on 0.121.0, where two cells
  # reached `await_ready()` for real and failed both CI arms with `NOT WRITABLE`. A container that is
  # not RUNNING is trivially true of a job that never started one; it is not evidence about the
  # daemon. 2.4's whole weekly run depends on which reading is right, and this repo has already paid
  # once for a prerequisite written on exactly that ambiguity (reshape-plan §13, corrected by step 0).
  # So it is measured here, and `substrate_check` prints the daemon's version either way.
  #
  # BOTH SUBSTRATES SINCE 0.172.0 — this is the second matrix leg the previous comment promised.
  # It said "GITEA ONLY ... Odoo is not baselined anyway", and that reason expired the moment
  # `baselines/customer_v1_odoo.json` was cut (2.4b): a number now depends on Odoo's container layer,
  # and the job header's own argument — "a container layer nothing exercises between weekly runs is
  # one that breaks silently" — applies to it exactly as it does to Gitea.
  #
  # WHAT IS UNMEASURED, STATED RATHER THAN ASSUMED: Gitea's image is PULLED (242 MB) and R4.109 timed
  # it on a real runner at 12.5 s up / 8.7 s seeded. Odoo's is BUILT from a Dockerfile on a ~1.5 GB
  # base and NOBODY HAS EVER RUN IT ON CI. Locally its seed is 87.6 s. So this leg is partly a
  # measurement, and `fail-fast: false` is what stops it masking Gitea's verdict while that is true.
  # If it proves too slow or too large for a per-PR job, the fix is to restrict this leg to the
  # scheduled run — NOT to widen a timeout until it fits.
  substrates:
    name: a benchmark substrate comes up and can be written to (${{ matrix.substrate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        substrate: [gitea, odoo]
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      # NO BROWSER. `assert_login_discriminates` needs Chromium and already runs inside every scored
      # run, where it guards the thing that matters. This is the layer BELOW it — compose, container
      # health, a substantive HTTP body, and a real write through the substrate's own API — and
      # keeping it browser-free is what makes it cheap enough for every pull request.
      # ONE BUDGET FOR BOTH LEGS, sized for the one that BUILDS its image. The signal a timeout
      # carries here is "the step hung", not "the step was slower than usual" — a provisioning
      # over-run must fail at a NAMED step in minutes rather than at the job wall (step 0's rule) —
      # and 25 minutes serves that for a leg measured at ~21 s and a leg nobody has timed here.
      - name: Bring up ${{ matrix.substrate }}, seed it, prove it writable
        timeout-minutes: 25
        run: >
          uv run --group bench --group providers --group mcp
          python -m benchmarks.substrate_check --substrate ${{ matrix.substrate }}

  # ------------------------------------------------------------------------------------------------
  # THE CUSTOMER BENCHMARK (reshape-plan 2.4). THIS ONE SPENDS MONEY.
  #
  # NO `needs:` SINCE 0.172.0, AND THE REASON IS MEASURED RATHER THAN PREFERRED. It used to read
  # `needs: substrates`, "so a dead container layer costs nothing instead of a wasted pass". That was
  # true while `substrates` had ONE leg and guarded the one substrate this job paid for. With two
  # legs it is a FAN-IN: `needs:` names a job, Actions has no per-matrix-leg dependency, a matrix
  # job concludes `failure` if ANY leg fails, and this job's `if:` carries no status function — so
  # implicit `success()` applies and BOTH bench legs skip. A failure of the Odoo container layer,
  # which has never run on a CI runner at all, would therefore have deleted that week's GITEA data
  # point from the only published, gated measurement series in the repository, for a reason nothing
  # to do with Gitea.
  #
  # AND THE FAN-IN PROTECTED NO DOLLARS, which is what settles it rather than the coupling being
  # merely ugly. The paid step (`benchmarks.corpus_run`) is preceded IN THIS JOB by
  # `Provision ${{ matrix.substrate }} ... --keep`, so a dead container layer already fails before a
  # cent is spent — that is R4.110's fix and it is per-leg. `needs:` bought a few minutes of FREE CI
  # and cost a substrate's weekly measurement. `substrates` still runs, still on every pull request,
  # and is still the cheap early warning; it simply no longer gates a job whose money is guarded one
  # layer in.
  #
  # BOTH SUBSTRATES SINCE 0.172.0, each gated against its own baseline. The old reason for excluding
  # Odoo — "measured mean 0.181, std 0.203, with 58% of its replay refusals being the mutation gate"
  # — is four Odoo corpus series stale: it measures **0.714 ± 0.000** with `varies` 0 and `unstable`
  # 0, which is TIGHTER than Gitea was when its own baseline was cut, and `over_gated/drift` has been
  # 0 since 0.158.0.
  #
  # IT USED TO DOUBLE THE WEEKLY SPEND, and since 0.181.0 there IS no weekly spend -- this job is off
  # the schedule. Kept as the price of a DISPATCH, which is what a reader now needs: a second
  # substrate at a similar per-substrate cost, the three Gitea passes averaging $0.603 and the three
  # Odoo passes $0.602, so dispatching both legs costs ~$1.20. It was ~$1.20 a WEEK (~$5.20/month)
  # from 0.172.0 until 0.181.0.
  #
  # THE BASELINES' `cost_usd` IS NOT THE SPEND and must not be quoted as it — 0.842 for Gitea and
  # 0.664 for Odoo are the MAXIMUM observed pass, recorded as the alarm threshold (R4.106). A first
  # draft of this comment quoted Odoo's 0.664 as "Gitea's", which is two mistakes in one number.
  #
  # IF THE KEY IS MISSING THIS FAILS, LOUDLY, NAMING THE REMEDY — it does not skip. A benchmark that
  # quietly does not run is worse than one that is red, because the first reads as "we are measuring"
  # and the second reads as "fix me". The remedy is one action by one person and is stated in the
  # step, which is what makes the alarm dischargeable rather than noise (R3.9/CLI-1).
  # WHY THIS NO LONGER RUNS ON THE SCHEDULE (0.181.0). Active development of this project stopped on
  # 2026-09-09; see the close-out banner at the top of `docs/open-defects.md`. A weekly paid run
  # measures whether a change regressed the product, and there are no more changes -- so it would
  # spend ~$1.20 a week to re-answer a question about a tree that does not move. That is the whole
  # reason, and it is worth stating rather than leaving the reader to infer it from a deleted line.
  #
  # IT IS DISABLED BY REMOVING THE TRIGGER, NOT BY MAKING THE JOB QUIET. The `if:` no longer admits
  # `schedule`; everything else is untouched, so a dispatch with `run_bench: true` still buys a full
  # gated pass against the committed baselines. Commenting the job out, deleting it, or wrapping the
  # paid step in `|| true` would each have cost something this repository deliberately keeps: the
  # first two lose the ability to re-measure at all, and the third is the `|| true` that R3.9/CLI-1
  # says takes every other channel dark with it.
  #
  # WHAT IS STILL WATCHED, because "we stopped paying" must not read as "we stopped checking": the
  # merge gate in `ci.yml` runs the full suite on both OSes, `red-proof` still proves the mutation
  # registries red on every PR, `sweep` still runs weekly and free, and `substrates` still runs on
  # every pull request touching the bench. The only thing that stopped is the one that costs money.
  #
  # WHAT THE BASELINES MEAN NOW. `baselines/customer_v1_gitea.json` (0.762) and `_odoo.json` (0.714)
  # are the last measurements taken, and NOTHING will re-take them. Read them as dated observations,
  # not as the current rate -- a later Gitea series measured 0.857 and was never cut as a baseline.
  # NEITHER FILE RECORDS ITS OWN CUT DATE OR VERSION: the 2026-08-26 and 2026-09-05 (at 0.169.0)
  # dates live only in `baselines/README.md` and `CLAUDE.md`. That is a real gap, recorded in the
  # close-out banner rather than papered over by adding a field while freezing the artifact.
  customer-bench:
    name: the customer benchmark, gated against its baseline (${{ matrix.substrate }})
    if: github.event.inputs.run_bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # NOT fail-fast: the two substrates answer different questions, and a Gitea regression must not
      # cancel the Odoo pass that would have said whether the same change hit both.
      fail-fast: false
      matrix:
        substrate: [gitea, odoo]
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      # BYTE-IDENTICAL to every other browser install in this repository;
      # `tests/test_ci_provisioning.py` asserts that across workflow files, not within one.
      - name: Install Chromium
        timeout-minutes: 8
        run: uv run --group bench playwright install chromium

      - name: Refuse to start without a key
        timeout-minutes: 2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No ANTHROPIC_API_KEY secret is configured for this repository, so the"
            echo "::error::customer benchmark cannot run. It is REFUSING rather than skipping: a"
            echo "::error::benchmark that quietly does not run reads as one that is measuring."
            echo "::error::Remedy: add the repository secret ANTHROPIC_API_KEY (Settings ->"
            echo "::error::Secrets and variables -> Actions). Nothing else about this job needs it."
            exit 1
          fi
          echo "a key is configured; its value is never printed, logged or written to disk"

      # PROVISION THE SUBSTRATE IN THIS JOB, because `needs:` is ORDERING AND NOT A SHARED MACHINE.
      # Every job gets a fresh runner, so the `substrates` job's containers do not exist here — and
      # `score_one` calls `reset()` and `await_ready()` but never `up()`, because on a developer host
      # the substrate is already running. That assumption cost 2.4a's first real weekly run: all
      # seven scenarios raised `no seed at /data/gitea/seed.db` (R4.110).
      #
      # (That last paragraph is the record of a `needs: substrates` that was REMOVED at 0.172.0 --
      # see the block above the job key, which measured that the fan-in protected no dollars, since
      # the provisioning step below already fails before a cent is spent. `substrates` still runs,
      # still on every bench PR; it simply does not gate this job. The paragraph is kept rather than
      # deleted because the reason it was once there is the reason somebody would re-add it.)
      - name: Provision ${{ matrix.substrate }} for the scored run
        timeout-minutes: 25
        run: >
          uv run --group bench --group providers --group mcp
          python -m benchmarks.substrate_check --substrate ${{ matrix.substrate }} --keep

      # ONE PASS, gated against the committed baseline. `--baseline` is what turns on the cost, rate
      # and flip channels; without it `gate_bench_record` runs the ABSOLUTE channels only and would
      # print PASS having compared against nothing.
      # `--acknowledge` IS PASSED FOR BOTH LEGS AND GITEA'S FILE IS EMPTY, on purpose. Channel 0
      # fails any row the corpus could not properly measure unless its `(scenario, reason)` pair is
      # signed for; Odoo has exactly one (`odoo-search`, R4.130) and Gitea has none. An EMPTY
      # committed allowlist states that as a reviewable fact rather than as an absent flag — the same
      # "quiet is an allowlist" rule this benchmark is built on — and it keeps the two legs ONE
      # shape instead of one leg plus a special case.
      - name: Run the ${{ matrix.substrate }} corpus and gate it
        timeout-minutes: 45
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          uv run --group bench --group providers --group mcp
          python -m benchmarks.corpus_run --substrate ${{ matrix.substrate }}
          --baseline baselines/customer_v1_${{ matrix.substrate }}.json
          --acknowledge baselines/customer_v1_${{ matrix.substrate }}.acknowledged.json
          --out weekly-${{ matrix.substrate }}.jsonl

      # THE RECORD SURVIVES THE RUN. Actions logs expire; a series of weekly records is the only way
      # the flake-versus-regression question ever gets answered, and it is the question B3 refuses to
      # gate a single flip over.
      - name: Upload the record
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: customer-bench-${{ matrix.substrate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: weekly-${{ matrix.substrate }}.jsonl
          if-no-files-found: ignore
