name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE FAST TIER — the first thing that can go red, in ~2 min instead of ~17.
  #
  # It installs NO browser: the tier's whole claim is that these tests never launch one, and the claim is
  # enforced rather than trusted — the ROOT `conftest.py` wraps every Playwright entry point on the CLASS and
  # RAISES here, so a test that is unclassified and launches anyway fails loudly instead of quietly
  # running slowly. That also makes this job a check on the manifest itself: a collected test in neither
  # tier is a collection error naming it, which is `check_shard_coverage`'s property one instrument over.
  #
  # BOTH OSes, deliberately, even though the logic is OS-independent: the manifest is generated on one
  # machine, and a collection difference between platforms is exactly the drift that would otherwise be
  # discovered only by whoever next typed `--tier fast` on the other one. It is ~2 min without a browser.
  #
  # This does NOT replace the merge gate. The full key-less suite on both OSes below is still what green
  # means; this is the signal that arrives before you have made coffee.
  fast:
    name: fast tier (${{ matrix.os }}, no browser)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          # FULL history. `tests/test_manifest_cost.py` derives the tier manifest's re-derivation
          # deltas from `git log --follow` over it, and a depth-1 clone shows ONE revision —
          # reproduced against a real shallow clone before it could go red here.
          fetch-depth: 0
      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Run the fast tier
        timeout-minutes: 9
        run: uv run --group bench --group providers --group mcp pytest -q --tier fast

  # RED-PROOF. The matrix's whole claim is a NUMBER — eleven mutations of the record plumbing that
  # survived the entire 1100-test suite (R4.48) are now killed — and a claim nobody re-measures is how a
  # green instrument stays green while covering less. This applies each mutation to a SCRATCH COPY of
  # src/ and fails if any survives unregistered, or if a mutation has gone STALE (its find-text no longer
  # matches), because a stale mutation silently reports the suite as stronger than it is.
  #
  # No browser: the killer suite is the browser-free exit-set matrix, so this costs ~2 min.
  red-proof:
    name: the wiring mutants stay dead
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          # FULL history. `tests/test_manifest_cost.py` derives the tier manifest's re-derivation
          # deltas from `git log --follow` over it, and a depth-1 clone shows ONE revision —
          # reproduced against a real shallow clone before it could go red here.
          fetch-depth: 0
      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Apply every wiring mutation
        timeout-minutes: 14
        run: uv run --group bench --group providers --group mcp python scripts/prove_red.py tests/mutations/b1_wiring.py

      # A SECOND registry rather than a longer first one: these mutate `obs.py`, and the suite that
      # kills them is three small files rather than the exit-set matrix. One invocation per (what is
      # mutated, what kills it) pair keeps a failure naming both.
      - name: Apply every cannot-spend mutation
        timeout-minutes: 10
        run: >
          uv run --group bench --group providers --group mcp python scripts/prove_red.py
          tests/mutations/cannot_spend.py
          --tests tests/test_cannot_spend.py tests/test_run_record.py tests/test_obs.py

      # A THIRD registry, same reasoning as the second. These mis-key the engine chain's internal
      # forwards, and three of the seven are TYPE-SILENT swaps the arity pin is fully satisfied by --
      # which is the whole reason step 1.1 shipped a forwarding sensor beside the arity one.
      - name: Apply every keyword-only-chain mutation
        timeout-minutes: 10
        run: >
          uv run --group bench --group providers --group mcp python scripts/prove_red.py
          tests/mutations/keyword_only_chain.py
          --tests tests/test_engine_chain_is_keyword_only.py

  # RED-IN-CI (reshape-plan 0.4b). "Verify a regression test fails against the old code" has been in
  # CLAUDE.md since round 1 and has caught several no-op fixes BY HAND. This is the hand-check as a job:
  # difference this branch's pytest collection against the base's, run the NEW ids twice -- once against
  # this branch's src/ and once with the base's src/ first on PYTHONPATH, the same install `prove_red`
  # uses -- and fail if none of them is red against the base.
  #
  # TWICE, not once, and that is the whole reason it can be believed. A new browser cell on a runner
  # with no Chromium, a cell red for an unrelated reason, an id whose fixture is broken -- each fails
  # against the base too, and a single-run design scores every one of them as a guard. Same rule as
  # `prove_red._require_a_live_killer_suite`: check the unmutated tree first, or every mutant is
  # "killed" by a suite that is simply broken.
  #
  # It needs Chromium for the same reason: a new browser cell that cannot launch would report `failed`
  # on BOTH runs and be classified `unusable` rather than silently counted as evidence.
  #
  # `pull_request` only. On a push to main there is no base to difference against that means anything.
  red-in-ci:
    name: a new test is red against the base
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          # FULL history: the base worktree is created from `github.event.pull_request.base.sha`, and
          # a shallow clone does not have it. Same reason as the jobs above, different consumer.
          fetch-depth: 0
      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Install Chromium
        timeout-minutes: 8
        run: uv run --group bench playwright install chromium
      - name: Run each new test id against the base's src/
        timeout-minutes: 20
        # The BASE SHA, not `origin/main`. On a `pull_request` GitHub checks out `refs/pull/N/merge`,
        # so `origin/main` has moved on independently of what this PR was branched from -- the same
        # ambiguity that made `scripts/tier_marks.py` identify a run by its collected ID SET rather
        # than by a sha. The base sha is the one ref that means "what this PR is proposing to change".
        run: >
          uv run --group bench --group providers --group mcp python scripts/red_in_ci.py
          --base ${{ github.event.pull_request.base.sha }}

  # Sharding trades one silent failure for another if left unchecked: a test in NO shard leaves every
  # shard GREEN, and nothing in the suite can fail for it — the coverage is gone and the signal that
  # would have told you is the signal that was removed. Collection only, so it costs seconds and launches
  # no browser. Runs on Linux alone: the partition is a property of the collection, not of the OS.
  shard-coverage:
    name: shards partition the suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          # FULL history. `tests/test_manifest_cost.py` derives the tier manifest's re-derivation
          # deltas from `git log --follow` over it, and a depth-1 clone shows ONE revision —
          # reproduced against a real shallow clone before it could go red here.
          fetch-depth: 0
      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Check the shards partition the collection
        timeout-minutes: 9
        run: uv run --group bench --group providers --group mcp python scripts/check_shard_coverage.py

  test:
    name: tests (${{ matrix.os }} ${{ matrix.group }}/2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # Windows is the primary dev platform; Linux is the portability check
        # SHARDED, because the suite was 21m53s against this job's 25-minute timeout on Windows and grows
        # every slice — a deterministic failure approaching, unlike the intermittent WSAENOBUFS below.
        # Measured alternative, rejected: pooling Chromium across sessions has a ceiling of 2.9 min
        # (356.7ms -> 84.7ms per session over ~650 sessions) and cannot reach the suite without moving
        # all 1191 collected tests onto a session-scoped event loop, because a Playwright Browser is
        # loop-bound. (This line said "836 tests" until reshape-plan step 0; that was the collection size when the
        # split was written, and `.test_durations` still holds exactly those 836 ids -- so ~30% of the
        # suite is duration-ESTIMATED. Measured, that costs nothing worth fixing: the shards land
        # 13.7/13.1 min on ubuntu and 16.3/15.4 on windows, ~4% apart. Balance is not this arm's
        # problem, and regenerating the file was refused on that measurement -- see
        # docs/ci-provisioning.md.)
        #
        # Separate RUNNERS, deliberately, not `-n 2` on one: xdist would double concurrent Chromium on a
        # single machine, which is the standing suspect for the WSAENOBUFS failure. This halves per-runner
        # churn instead. (That is a hypothesis, not a claim — see R4.22.)
        group: [1, 2]
    env:
      UV_PYTHON: "3.12"                        # match the dev interpreter (project requires >=3.12)
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          # FULL history. `tests/test_manifest_cost.py` derives the tier manifest's re-derivation
          # deltas from `git log --follow` over it, and a depth-1 clone shows ONE revision —
          # reproduced against a real shallow clone before it could go red here.
          fetch-depth: 0

      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@v8.2.0   # no moving `v8` tag is published; pin the full release
        with:
          enable-cache: true

      # The suite drives real headless Chromium against local HTTP fixtures (no API keys, no network),
      # so it needs the browser. `--group bench` pulls in MiniWoB++.
      #
      # ONE step, byte-identical on both OSes, and deliberately WITHOUT `--with-deps`. The Linux arm
      # carried that flag and it was measured to install NOTHING but fonts: on every ubuntu job that got
      # past `apt-get update`, apt reported all of Chromium's runtime libraries as "already the newest
      # version" and printed the same plan -- `0 upgraded, 9 newly installed`, all nine of them
      # `fonts-*`/`xfonts-*`, 21.1 MB of CJK/Cyrillic/Thai/Unifont glyph coverage. The libraries this
      # suite actually needs are on the runner image already.
      #
      # What the flag COST was the ubuntu arm: 8 of 58 jobs over two days died inside it. Six were
      # still in `apt-get update` at the wall, having run ZERO tests, after the runner-local
      # `azure.archive.ubuntu.com` mirror was `Ign:`-ed and apt failed over to the public archive with
      # no effective timeout -- one stalled 22m55s on a single 126 kB file. Others crawled through the
      # font fetch at 26.9 kB/s (13m05s) and starved the suite of the job's budget. Meanwhile the SUITE
      # step was 12.4-13.8 min throughout, flat, making ubuntu the FASTEST arm -- so the `cancelled`
      # jobs were misread as a capacity problem, which is how a wrong prerequisite reached
      # docs/reshape-plan.md section 13. Windows was the control the whole time: same download, no apt,
      # 18/18 completions at 18-29 s.
      #
      # Nothing here renders a non-Latin glyph -- `tests/` holds twelve distinct non-ASCII codepoints,
      # none of them CJK, Cyrillic or Thai, and every one sits in a Python comment or string constant
      # rather than in an HTML fixture. `docs/ci-provisioning.md` carries the full measurement, because
      # Actions logs expire and this comment would otherwise become unfalsifiable prose.
      #
      # `tests/test_ci_provisioning.py` pins the CLASS, not this instance: one browser install, shared
      # by both OSes, with no apt/sudo/`--with-deps` anywhere on the critical path.
      - name: Install Chromium
        timeout-minutes: 8
        run: uv run --group bench playwright install chromium

      # R4.22 instrument. Four occurrences of `ERR_NO_BUFFER_SPACE`, four different tests, both shards,
      # and still no diagnosis — because the post-mortem below can only see the state AFTER the suite
      # exits, and only when it fails. This samples throughout, and the summary step runs on SUCCESS too,
      # so there is finally a healthy baseline to compare a failing run against.
      #
      # It also measures NON-PAGED POOL, which no previous occurrence captured and which is the resource
      # WSAENOBUFS is actually about. Every hypothesis so far has been about something else.
      - name: Start the resource sampler (Windows)
        timeout-minutes: 2
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process pwsh -PassThru -WindowStyle Hidden -ArgumentList `
            '-NoProfile','-File','scripts/sample_resources.ps1', `
            '-OutFile','resource-samples.csv','-IntervalSeconds','5'
          $p.Id | Out-File sampler.pid
          Write-Output "sampler pid $($p.Id)"

      # THE ONE STEP WITH NO `timeout-minutes`, deliberately. The allowlist lives in
      # `tests/test_ci_provisioning.py`, which refuses a second entry without a stated reason.
      #
      # What that buys, stated at exactly its strength and no further: every OTHER authored step in
      # this file is budgeted, so a PROVISIONING over-run now fails at a NAMED step, in minutes, with
      # the job budget mostly unspent. It does NOT buy the converse. A job-level `cancelled` still has
      # more than one cause -- this suite exhausting the wall, the concurrency group superseding the
      # run, or the `always()`/`failure()` tail below running past it -- and the budgets are NOT summed
      # to exclude that. An earlier draft did claim the converse and was wrong twice over: the failure
      # path is longer than the success path, and GitHub injects its own unbudgetable steps
      # (`Set up job`, `Post Install uv`, `Complete job`) that no `timeout-minutes` can reach.
      #
      # Bounding this step too was refused. It would put a second, tighter ceiling underneath the job
      # wall with nothing to acknowledge it -- a scheduled future red on the merge gate, on the arm
      # that is actually growing (windows, 15.2-17.7 min). That is the D0 over-refusal shape wearing a
      # CI hat, and the job budget below already bounds this step.
      - name: Run the test suite (shard ${{ matrix.group }} of 2)
        # `--group providers` installs the OpenAI / Gemini SDKs and `--group mcp` the MCP SDK, so the
        # provider live-path + MCP-server tests actually run here (they `importorskip` and would
        # otherwise silently skip). Still key-less (no API keys, no network beyond localhost fixtures).
        #
        # `--splits/--group` PARTITIONS THE COLLECTION, so every collected test is in exactly one shard
        # and a file added tomorrow lands in one by construction. That property is the whole reason this
        # is not a hand-maintained list of files per shard: such a list would let a new file run in
        # NEITHER shard while both report green, which is a silent loss of coverage that no test can fail
        # for. Balance comes from `.test_durations`; when it goes stale, unknown tests are estimated and
        # the shards drift in WALL-CLOCK only — never in coverage.
        env:
          # Names the part by (os, shard) and DELIBERATELY NOT by attempt. "Re-run failed jobs" leaves
          # artifacts from both attempts under one run id (measured on run 31677764463), and the merge
          # reconciles them per LABEL — so putting the attempt in here would give one shard two labels
          # and make that reconciliation inert. Measured: it was, until 2026-08-20. The attempt stays in
          # the artifact NAME below, which is all v4's immutable-name rule needs.
          # `tests/test_ci_provisioning.py` pins that this template does not mention run_attempt.
          ULTRACUA_MARKS_LABEL: ${{ matrix.os }}-${{ matrix.group }}
        run: uv run --group bench --group providers --group mcp pytest -q --splits 2 --group ${{ matrix.group }} --emit-marks .scratch/marks/part.json

      # THE TIER MARKS. This is the whole of reshape-plan step 0.8 on the CI side: the shard above
      # already observed which tests launch a browser (an autouse probe records it on every run), and
      # until now that evidence was thrown away — so a contributor adding three browser-free cells paid
      # a 36-minute local suite run to rediscover it. Emitting costs one JSON dump and this upload.
      #
      # `continue-on-error` and `if-no-files-found: ignore`, matching the sampler below rather than
      # inverting it. The tempting inversion — make a missing part redden the job — was refused: it
      # would put an artifact-service flake on all four merge-gate jobs with nothing to acknowledge it,
      # which `ci.yml`'s own note at the suite step calls "the D0 over-refusal shape wearing a CI hat".
      # The loudness belongs in `scripts/tier_marks.py`, which REFUSES to merge an incomplete set and
      # can say exactly which shard is missing, where a human can act on it.
      - name: Upload tier marks
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tier-marks-${{ matrix.os }}-${{ matrix.group }}-${{ github.run_attempt }}
          path: .scratch/marks/part.json
          if-no-files-found: ignore

      # ALWAYS, not `if: failure()` — a baseline from a PASSING run is the entire point, and is what four
      # failure-only post-mortems could not provide. Peaks, because the peak is what the failure is about
      # and the post-mortem's post-teardown numbers structurally cannot show it.
      - name: Resource sampler summary (peaks + baseline)
        timeout-minutes: 3
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path sampler.pid) {
            Stop-Process -Id (Get-Content sampler.pid) -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path resource-samples.csv)) { Write-Output "no samples"; exit 0 }
          $r = Import-Csv resource-samples.csv
          Write-Output "samples=$($r.Count)  outcome=${{ job.status }}  shard=${{ matrix.group }}/2"
          foreach ($c in 'time_wait','handles','processes','chrome_procs','nonpaged_pool_mb','paged_pool_mb') {
            $v = $r.$c | ForEach-Object { [double]$_ }
            "{0,-18} max={1,10:F1}  mean={2,10:F1}  last={3,10:F1}" -f `
              $c, ($v | Measure-Object -Maximum).Maximum, ($v | Measure-Object -Average).Average, $v[-1]
          }
          $free = $r.free_mb | ForEach-Object { [int]$_ }
          "{0,-18} min={1,10}  (MB)" -f 'free_mb', ($free | Measure-Object -Minimum).Minimum

      - name: Upload resource samples
        timeout-minutes: 5
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: resource-samples-${{ matrix.os }}-${{ matrix.group }}-${{ github.run_attempt }}
          path: resource-samples.csv
          if-no-files-found: ignore

      # RESOURCE POST-MORTEM. The suite has TWICE failed on the Windows runner with
      # `net::ERR_NO_BUFFER_SPACE` (WSAENOBUFS) on `Page.goto` — a RESOURCE error, in whichever test
      # happened to be running, not a defect in that test. Diagnosing it after the fact cost a day of
      # hypothesis-guessing, so capture the state instead of guessing again.
      #
      # RULED OUT, so don't re-derive it: ephemeral-port exhaustion (peak TIME_WAIT ~276 locally, 133 at
      # the 2nd CI failure, against a 16384-port range), leaked processes (`chromium_still_running=0`),
      # and memory (13372 MB free of 16379 at failure). The remaining suspect is the Chromium
      # launch/teardown churn itself — ~650 cycles per full run, now ~325 per runner with the shard split
      # above, which is a real reduction in the suspected pressure but NOT a fix aimed at it.
      #
      # TWO GAPS IN THIS INSTRUMENT, worth closing before a third occurrence (R4.22): it runs AFTER the
      # suite exits, so every number is post-teardown and none of them can see the PEAK that caused the
      # failure; and it only runs on failure, so there is no healthy-run baseline against which
      # "total_handles=45285" could be called high or normal.
      #
      # `continue-on-error` so a diagnostic can never itself redden a run.
      - name: Resource post-mortem (on failure only)
        timeout-minutes: 5
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Output "=== dynamic port range ==="
          if ($IsWindows) { netsh int ipv4 show dynamicport tcp } else { cat /proc/sys/net/ipv4/ip_local_port_range }
          Write-Output "=== TIME_WAIT (ephemeral) ==="
          if ($IsWindows) {
            $tw = @(Get-NetTCPConnection -State TimeWait -ErrorAction SilentlyContinue)
            Write-Output "time_wait_total=$($tw.Count) ephemeral=$(@($tw | Where-Object { $_.LocalPort -ge 49152 }).Count)"
          } else { ss -s }
          Write-Output "=== processes / handles ==="
          if ($IsWindows) {
            $p = Get-Process -ErrorAction SilentlyContinue
            Write-Output "process_count=$($p.Count) total_handles=$(($p | Measure-Object -Property HandleCount -Sum).Sum)"
            Write-Output "chromium_still_running=$(@($p | Where-Object { $_.ProcessName -like 'chrome*' }).Count)"
            $p | Sort-Object HandleCount -Descending | Select-Object -First 12 ProcessName, HandleCount, WS | Format-Table -AutoSize
          } else { ps -eo comm,rss --sort=-rss | head -15 }
          Write-Output "=== memory ==="
          if ($IsWindows) {
            $os = Get-CimInstance Win32_OperatingSystem
            Write-Output "free_mb=$([int]($os.FreePhysicalMemory/1KB)) total_mb=$([int]($os.TotalVisibleMemorySize/1KB))"
          } else { free -m }
